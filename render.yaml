# Render Blueprint - One-Click Automatic Deployment
# https://render.com/docs/blueprint-spec

databases:
  - name: ims-database
    plan: free
    databaseName: ims_db
    user: ims_user

services:
  # 1. FastAPI Python Backend
  - type: web
    name: ims-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt && python seed.py"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: ims-database
          property: connectionString

  # 2. Next.js Frontend
  - type: web
    name: ims-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    startCommand: "npm start"
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: ims-backend
          property: host
